<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>여름 과일 물총놀이 💦🍉</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent; }
  html,body { width:100%; height:100%; overflow:hidden; font-family:'Apple SD Gothic Neo','Malgun Gothic',sans-serif; background:#eaf9ff; touch-action:none; }
  #stage { position:fixed; inset:0; }
  canvas { position:absolute; inset:0; width:100%; height:100%; touch-action:none; }

  #scoreboard { position:absolute; top:0; left:0; width:100%; display:flex; pointer-events:none; z-index:5; }
  .lane-score { flex:1; margin:10px; padding:8px 4px; border-radius:18px; text-align:center;
    background:rgba(255,255,255,.85); box-shadow:0 4px 14px rgba(0,0,0,.22); }
  .lane-score .nm { font-size:clamp(15px,2.4vw,26px); font-weight:800; }
  .lane-score .pt { font-size:clamp(30px,6vw,64px); font-weight:900; line-height:1; }
  .lane-score.l0 { border:5px solid #ff5d8f; } .lane-score.l0 .pt{ color:#ff2e6e;}
  .lane-score.l1 { border:5px solid #ffb02e; } .lane-score.l1 .pt{ color:#f08c00;}
  .lane-score.l2 { border:5px solid #2ec5ff; } .lane-score.l2 .pt{ color:#0d8fd1;}

  #timer { position:absolute; top:14px; left:50%; transform:translateX(-50%); z-index:6;
    background:#fff; color:#0b1e3a; font-size:clamp(26px,5vw,52px); font-weight:900;
    padding:4px 26px; border-radius:40px; box-shadow:0 4px 14px rgba(0,0,0,.3); min-width:110px; text-align:center;}
  #timer.warn { background:#ff3b3b; color:#fff; animation:pulse .5s infinite; }
  @keyframes pulse { 50%{ transform:translateX(-50%) scale(1.12);} }

  .overlay { position:absolute; inset:0; z-index:20; display:flex; flex-direction:column;
    align-items:center; justify-content:center; text-align:center; color:#fff;
    background:radial-gradient(circle at 50% 30%, #2a7de1, #0b1e3a 78%); padding:24px; }
  .overlay h1 { font-size:clamp(40px,8vw,92px); text-shadow:0 6px 0 rgba(0,0,0,.25); margin-bottom:10px; }
  .overlay p { font-size:clamp(18px,3.2vw,30px); margin:8px 0; line-height:1.5; max-width:900px; }
  .btn { margin-top:26px; font-family:inherit; font-size:clamp(26px,4.5vw,44px); font-weight:900;
    color:#fff; background:linear-gradient(#ffb02e,#ff7a00); border:none; border-radius:60px;
    padding:18px 60px; box-shadow:0 8px 0 #c25e00, 0 12px 22px rgba(0,0,0,.4); cursor:pointer; }
  .btn:active { transform:translateY(6px); box-shadow:0 2px 0 #c25e00; }
  .emoji-row { font-size:clamp(40px,8vw,80px); margin:6px 0 4px; }
  .hint { background:rgba(255,255,255,.14); border-radius:24px; padding:18px 26px; margin-top:14px; }
  .hint b { color:#ffe66b; }

  #countdown { position:absolute; inset:0; z-index:30; display:none; align-items:center; justify-content:center;
    font-size:min(40vw,300px); font-weight:900; color:#fff; text-shadow:0 0 40px #ffd43b, 0 8px 0 rgba(0,0,0,.3); }

  .hidden{ display:none!important; }
  #resultList{ display:flex; gap:18px; margin:18px 0; flex-wrap:wrap; justify-content:center;}
  .res-card{ background:rgba(255,255,255,.92); color:#0b1e3a; border-radius:24px; padding:18px 26px; min-width:160px;}
  .res-card .nm{ font-size:28px; font-weight:900;}
  .res-card .pt{ font-size:60px; font-weight:900;}
  .res-card.win{ outline:6px solid #ffd43b; transform:scale(1.08);}
  .crown{ font-size:48px;}
</style>
</head>
<body>
<div id="stage">
  <canvas id="cv"></canvas>

  <div id="timer">50</div>
  <div id="scoreboard">
    <div class="lane-score l0"><div class="nm">1번 친구</div><div class="pt" id="s0">0</div></div>
    <div class="lane-score l1"><div class="nm">2번 친구</div><div class="pt" id="s1">0</div></div>
    <div class="lane-score l2"><div class="nm">3번 친구</div><div class="pt" id="s2">0</div></div>
  </div>

  <div id="countdown"></div>

  <div id="startScreen" class="overlay">
    <div class="emoji-row">🍉 🍑 🍇 💦</div>
    <h1>여름 과일 물총놀이</h1>
    <p>떨어지는 과일을 손으로 <b>콕!</b> 터치하세요! 👆💦</p>
    <div class="hint">
      <p>👉 과일을 <b>콕 터치</b>하면 물이 팡! 💦</p>
      <p>🍓 과일을 맞히면 <b>+1점</b></p>
      <p>🙅 <b>선생님 얼굴</b>은 터치하면 <b style="color:#ff8a8a">−2점</b>! (조심!)</p>
      <p style="font-size:.85em;opacity:.9">친구 3명이 화면 앞에 나란히 서서, 각자 자기 칸을 맡아요!</p>
    </div>
    <button id="startBtn" class="btn">시작하기 ▶</button>
  </div>

  <div id="resultScreen" class="overlay hidden">
    <h1>🎉 게임 끝! 🎉</h1>
    <div id="resultList"></div>
    <button id="againBtn" class="btn">다시 하기 🔄</button>
  </div>
</div>

const faceImgs = FACE_SRCS.map(s => { const im=new Image(); im.src=s; return im; });
const FRUITS = ["🍉","🍑","🍇","🍒","🍈","🍅","🥭","🍊"];

const canvas = document.getElementById('cv');
const ctx = canvas.getContext('2d');
const timerEl = document.getElementById('timer');
const sEls = [document.getElementById('s0'),document.getElementById('s1'),document.getElementById('s2')];
const startScreen = document.getElementById('startScreen');
const resultScreen = document.getElementById('resultScreen');
const startBtn = document.getElementById('startBtn');
const againBtn = document.getElementById('againBtn');
const countdownEl = document.getElementById('countdown');

let W=window.innerWidth, H=window.innerHeight;
function resize(){ W=window.innerWidth; H=window.innerHeight; canvas.width=W; canvas.height=H; }
window.addEventListener('resize', resize); resize();

let state='ready';
let scores=[0,0,0];
let fruits=[], splashes=[], floaters=[], ripples=[];
let gameStart=0, GAME_LEN=50;
let lastSpawn=0;
let shakeT=0;
const HIT_R=65;   // ★터치 명중 반경(px). 작을수록 정확히 눌러야 함

/* 배경 구름 */
let clouds=[];
function initClouds(){
  clouds=[];
  for(let i=0;i<5;i++) clouds.push({x:Math.random()*W, y:40+Math.random()*(H*0.4), s:0.7+Math.random()*0.9, v:0.15+Math.random()*0.25});
}
initClouds();

/* ===== 사운드 ===== */
let actx=null;
function initAudio(){ if(!actx) actx=new (window.AudioContext||window.webkitAudioContext)(); }
function tone(freq,dur,type='sine',vol=.25,slideTo=null){
  if(!actx) return;
  const o=actx.createOscillator(), g=actx.createGain();
  o.type=type; o.frequency.value=freq;
  if(slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, actx.currentTime+dur);
  g.gain.setValueAtTime(vol, actx.currentTime);
  g.gain.exponentialRampToValueAtTime(.001, actx.currentTime+dur);
  o.connect(g); g.connect(actx.destination); o.start(); o.stop(actx.currentTime+dur);
}
function sfxSplash(){ tone(880,.07,'triangle',.16,1500); tone(400,.10,'sine',.12,180);}
function sfxHit(){ tone(660,.10,'square',.2,1320); tone(990,.12,'sine',.15,1760);}
function sfxBad(){ tone(160,.30,'sawtooth',.32,70); shakeT=14; }
function sfxCount(h){ tone(h?880:520,.18,'sine',.3); }
function sfxFanfare(){ [523,659,784,1047].forEach((f,i)=>setTimeout(()=>tone(f,.3,'triangle',.3),i*140)); }
let bgmTimer=null;
function startBGM(){
  if(!actx) return;
  const notes=[523,587,659,784,659,587,523,659, 698,659,587,523,587,659,523,494];
  let i=0;
  bgmTimer=setInterval(()=>{
    if(state!=='playing') return;
    const f=notes[i%notes.length]; tone(f,.22,'triangle',.07); tone(f/2,.22,'sine',.05); i++;
  },220);
}
function stopBGM(){ if(bgmTimer){clearInterval(bgmTimer); bgmTimer=null;} }

function laneOf(x){ return x < W/3 ? 0 : (x < 2*W/3 ? 1 : 2); }

/* ===== 터치/클릭 입력 ===== */
function hitAt(cx,cy){
  if(state!=='playing') return;
  const lane=laneOf(cx);
  ripples.push({x:cx,y:cy,r:8,life:1});
  makeSplash(cx,cy,'#bfeaff',9);
  let best=-1,bestD=HIT_R;
  for(let i=0;i<fruits.length;i++){
    const f=fruits[i], d=Math.hypot(f.x-cx,f.y-cy);
    if(d<bestD){ best=i; bestD=d; }
  }
  if(best>=0){
    const f=fruits[best];
    if(f.isTeacher){
      scores[lane]=Math.max(0,scores[lane]-2);
      floaters.push({x:f.x,y:f.y,txt:'-2',col:'#ff4d4d',life:1,vy:-1.4});
      makeSplash(f.x,f.y,'#ff6b6b',26); sfxBad();
    }else{
      scores[lane]+=1;
      floaters.push({x:f.x,y:f.y,txt:'+1',col:'#fff',life:1,vy:-1.4});
      makeSplash(f.x,f.y,'#7ad7ff',22); sfxHit();
    }
    fruits.splice(best,1); updateScores();
  }
  sfxSplash();
}
function toCanvas(clientX,clientY){
  const r=canvas.getBoundingClientRect();
  return [ (clientX-r.left)*(canvas.width/r.width), (clientY-r.top)*(canvas.height/r.height) ];
}
canvas.addEventListener('touchstart',e=>{
  e.preventDefault();
  for(const t of e.changedTouches){ const [x,y]=toCanvas(t.clientX,t.clientY); hitAt(x,y); }
},{passive:false});
canvas.addEventListener('mousedown',e=>{ const [x,y]=toCanvas(e.clientX,e.clientY); hitAt(x,y); });

function makeSplash(x,y,col,n){
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2, sp=2+Math.random()*6;
    splashes.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-2,life:1,col,r:3+Math.random()*4});
  }
}

/* ===== 게임 진행 ===== */
startBtn.addEventListener('click', ()=>{ initAudio(); startCountdown(); });
againBtn.addEventListener('click', ()=>{ initAudio(); startCountdown(); });

function startCountdown(){
  resultScreen.classList.add('hidden'); startScreen.classList.add('hidden');
  scores=[0,0,0]; updateScores(); fruits=[]; splashes=[]; floaters=[]; ripples=[];
  state='countdown';
  countdownEl.style.display='flex';
  let n=3; countdownEl.textContent=n; sfxCount(false);
  const iv=setInterval(()=>{
    n--;
    if(n>0){ countdownEl.textContent=n; sfxCount(false); }
    else if(n===0){ countdownEl.textContent="시작!"; sfxCount(true); }
    else { clearInterval(iv); countdownEl.style.display='none'; beginPlay(); }
  },800);
}
function beginPlay(){ state='playing'; gameStart=performance.now(); lastSpawn=0; startBGM(); }
function updateScores(){ for(let i=0;i<3;i++) sEls[i].textContent=scores[i]; }

function difficulty(t){
  return {
    spawnInterval: 880 - 640*t,          // 0.88초 → 0.24초
    fallSpeed: 3.0 + 5.8*t,              // 살짝 더 빠르게
    teacherChance: 0.13 + 0.06*t,
    burst: t>0.8 ? (Math.random()<0.45?3:2)
         : t>0.4 ? (Math.random()<0.5?2:1) : 1
  };
}
function spawnFruit(d){
  const lane = Math.floor(Math.random()*3);
  const x = lane*(W/3) + W/6 + (Math.random()-0.5)*(W/3-100);
  const isTeacher = Math.random() < d.teacherChance;
  fruits.push({
    x, y:-60, vy:d.fallSpeed*(0.85+Math.random()*0.4), vx:(Math.random()-0.5)*0.6,
    type: FRUITS[Math.floor(Math.random()*FRUITS.length)],
    isTeacher, faceIdx: Math.floor(Math.random()*faceImgs.length),
    rot:(Math.random()-0.5)*0.5, rotv:(Math.random()-0.5)*0.04,
    r: isTeacher?42:38, scale:0
  });
}

function loop(){
  requestAnimationFrame(loop);
  update(); render();
}
function update(){
  // 구름 흐름(항상)
  for(const c of clouds){ c.x+=c.v; if(c.x-120*c.s>W) c.x=-120*c.s; }

  if(state==='playing'){
    const elapsed=(performance.now()-gameStart)/1000;
    const remain=Math.max(0,GAME_LEN-elapsed);
    timerEl.textContent=Math.ceil(remain);
    timerEl.classList.toggle('warn', remain<=10);
    if(remain<=0){ endGame(); }
    const t=Math.min(1,elapsed/GAME_LEN), d=difficulty(t);
    if(performance.now()-lastSpawn > d.spawnInterval){
      lastSpawn=performance.now();
      for(let b=0;b<d.burst;b++) spawnFruit(d);
    }
    for(const f of fruits){ f.y+=f.vy; f.x+=f.vx; f.rot+=f.rotv; if(f.scale<1) f.scale=Math.min(1,f.scale+0.12); }
    fruits=fruits.filter(f=> f.y < H+70);
  }
  for(const s of splashes){ s.x+=s.vx; s.y+=s.vy; s.vy+=0.35; s.life-=0.035; }
  splashes=splashes.filter(s=>s.life>0);
  for(const r of ripples){ r.r+=4; r.life-=0.06; }
  ripples=ripples.filter(r=>r.life>0);
  for(const f of floaters){ f.y+=f.vy; f.life-=0.02; }
  floaters=floaters.filter(f=>f.life>0);
  if(shakeT>0) shakeT--;
}

function drawBackground(){
  // 하늘
  const sky=ctx.createLinearGradient(0,0,0,H);
  sky.addColorStop(0,'#7ec8ff'); sky.addColorStop(.6,'#bfe6ff'); sky.addColorStop(1,'#eaf9ff');
  ctx.fillStyle=sky; ctx.fillRect(0,0,W,H);
  // 해
  ctx.save(); ctx.globalAlpha=.9;
  const sg=ctx.createRadialGradient(W-90,90,10,W-90,90,90);
  sg.addColorStop(0,'#fff6b0'); sg.addColorStop(1,'rgba(255,220,80,0)');
  ctx.fillStyle=sg; ctx.beginPath(); ctx.arc(W-90,90,90,0,7); ctx.fill(); ctx.restore();
  // 구름
  ctx.fillStyle='rgba(255,255,255,.9)';
  for(const c of clouds){
    const s=c.s;
    ctx.beginPath();
    ctx.arc(c.x,c.y,26*s,0,7); ctx.arc(c.x+30*s,c.y-10*s,32*s,0,7);
    ctx.arc(c.x+62*s,c.y,26*s,0,7); ctx.arc(c.x+32*s,c.y+8*s,30*s,0,7);
    ctx.fill();
  }
  // 잔디 언덕
  ctx.fillStyle='#8fd66b';
  ctx.beginPath(); ctx.moveTo(0,H);
  ctx.quadraticCurveTo(W*0.3,H-90, W*0.55,H-55);
  ctx.quadraticCurveTo(W*0.8,H-20, W,H-70);
  ctx.lineTo(W,H); ctx.closePath(); ctx.fill();
}

function render(){
  drawBackground();
  let ox=0,oy=0;
  if(shakeT>0){ ox=(Math.random()-0.5)*shakeT*1.6; oy=(Math.random()-0.5)*shakeT*1.6; }
  ctx.save(); ctx.translate(ox,oy);

  // 레인 경계
  ctx.setLineDash([14,12]); ctx.lineWidth=4;
  for(let i=1;i<3;i++){ ctx.strokeStyle='rgba(255,255,255,.7)'; ctx.beginPath(); ctx.moveTo(i*W/3,0); ctx.lineTo(i*W/3,H); ctx.stroke(); }
  ctx.setLineDash([]);

  for(const f of fruits){
    ctx.save(); ctx.translate(f.x,f.y); ctx.rotate(f.rot); ctx.scale(f.scale,f.scale);
    if(f.isTeacher){
      const img=faceImgs[f.faceIdx];
      ctx.beginPath(); ctx.arc(0,0,f.r+6,0,7); ctx.fillStyle='rgba(255,60,60,.85)'; ctx.fill();
      if(img.complete) ctx.drawImage(img,-f.r,-f.r,f.r*2,f.r*2);
      ctx.font='28px serif'; ctx.textAlign='center'; ctx.fillText('🚫',0,-f.r-6);
    }else{
      ctx.font=(f.r*2.0)+'px serif'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(f.type,0,2);
    }
    ctx.restore();
  }

  // 터치 파문
  for(const r of ripples){
    ctx.globalAlpha=Math.max(0,r.life); ctx.strokeStyle='#ffffff'; ctx.lineWidth=3;
    ctx.beginPath(); ctx.arc(r.x,r.y,r.r,0,7); ctx.stroke();
  }
  ctx.globalAlpha=1;
  for(const s of splashes){ ctx.globalAlpha=Math.max(0,s.life); ctx.fillStyle=s.col; ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,7); ctx.fill(); }
  ctx.globalAlpha=1;
  for(const f of floaters){
    ctx.globalAlpha=Math.max(0,f.life);
    ctx.font='900 44px sans-serif'; ctx.textAlign='center'; ctx.fillStyle=f.col;
    ctx.strokeStyle='rgba(0,0,0,.4)'; ctx.lineWidth=5; ctx.strokeText(f.txt,f.x,f.y); ctx.fillText(f.txt,f.x,f.y);
  }
  ctx.globalAlpha=1;
  ctx.restore();
}

function endGame(){
  state='result'; stopBGM(); sfxFanfare(); timerEl.textContent='0';
  const max=Math.max(...scores);
  const list=document.getElementById('resultList'); list.innerHTML='';
  const names=['1번 친구','2번 친구','3번 친구'];
  for(let i=0;i<3;i++){
    const win = scores[i]===max && max>0;
    const div=document.createElement('div');
    div.className='res-card'+(win?' win':'');
    div.innerHTML=(win?'<div class="crown">👑</div>':'')+`<div class="nm">${names[i]}</div><div class="pt">${scores[i]}</div>`;
    list.appendChild(div);
  }
  resultScreen.classList.remove('hidden');
}

loop();
</script>
