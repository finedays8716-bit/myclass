<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>고래를 구해요! | 전자칠판</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:'Malgun Gothic','Apple SD Gothic Neo',sans-serif;color:white;background:#073b60}button,input{font:inherit}button{cursor:pointer}.board{position:relative;width:100%;min-height:100vh;overflow:hidden;background:radial-gradient(circle at 50% 4%,#36b9e8,#08739e 50%,#073b60)}.backdrop{position:absolute;inset:0;background-image:linear-gradient(0deg,rgba(2,35,65,.45),transparent 30%),url('assets/ocean_sick.jpg');background-size:cover;background-position:center;filter:saturate(1.08);transition:filter 1.3s,opacity 1.5s}.board.good .backdrop{filter:saturate(1.35) brightness(1.2)}.board.well .backdrop{opacity:.2}.caustics{position:absolute;inset:0;pointer-events:none;background:linear-gradient(130deg,transparent,rgba(151,251,255,.09),transparent);animation:shimmer 7s ease-in-out infinite alternate}@keyframes shimmer{to{transform:translateX(20%)}}.top{position:relative;z-index:2;display:flex;align-items:flex-start;justify-content:space-between;gap:20px;padding:2.4vw 3.5vw}.title{background:linear-gradient(120deg,#d5853a,#f8cb75,#bf6929);box-shadow:0 10px 0 #6e3b22,0 17px 28px #001d3880;border:5px solid #fff1c4;border-radius:24px;padding:12px 38px;color:#153965;font-size:clamp(29px,4.5vw,76px);font-weight:1000;letter-spacing:-.07em;text-shadow:2px 3px white;transform:rotate(-1deg)}.sub{margin:24px 10px 0;font-size:clamp(15px,1.7vw,28px);font-weight:900;text-shadow:0 4px 6px #02445c}.counter{flex:none;border:6px solid white;background:linear-gradient(170deg,#fffdf5,#fae3c7);border-radius:100px;padding:14px 30px;text-align:center;color:#153965;box-shadow:0 12px 22px #002f5280;min-width:200px}.counter small{display:block;font-size:clamp(14px,1.35vw,23px);font-weight:900}.counter strong{font-size:clamp(32px,4.2vw,75px);letter-spacing:-.04em}.center-text{position:absolute;bottom:21%;left:0;right:0;text-align:center;z-index:3;pointer-events:none;font-size:clamp(18px,2.4vw,39px);font-weight:1000;text-shadow:0 5px 8px #013350,1px 2px #013350}.footer{position:absolute;bottom:1.8%;left:3%;right:3%;z-index:3}.meter{display:grid;grid-template-columns:repeat(var(--slots),1fr);gap:3px;background:#e4f6ff;border:8px solid #9bddf2;border-radius:50px;padding:7px;box-shadow:0 6px 20px #001f3980}.slot{height:clamp(16px,3.3vw,48px);background:#85bad3;border-radius:15px;box-shadow:inset 0 3px 5px #2d6c9d55}.slot.filled{background:linear-gradient(#fff4a3,#fdbd2b);box-shadow:inset 0 3px #fff3c3,0 0 10px #ffe56b}.milestones{display:flex;justify-content:space-between;align-items:center;padding:12px 10px 0;font-size:clamp(11px,1.22vw,19px);font-weight:900;text-shadow:0 2px 5px #003}.milestone{opacity:.56}.milestone.on{opacity:1;color:#fff9a2}.happy{position:absolute;inset:15% 0 17%;display:flex;align-items:center;justify-content:center;z-index:2;opacity:0;transform:scale(.7);pointer-events:none;transition:opacity 1s,transform 1.8s}.well .happy{opacity:1;transform:scale(1)}.happy img{max-height:80%;max-width:70%;object-fit:contain;filter:drop-shadow(0 20px 25px #002b5b75);animation:float 4s ease-in-out infinite}@keyframes float{50%{transform:translateY(-25px) rotate(3deg)}}.happy h2{font-size:clamp(30px,5vw,83px);text-shadow:0 8px 18px #003b56}.overlay{position:fixed;inset:0;background:#03273acc;z-index:20;display:none;align-items:center;justify-content:center;padding:20px}.overlay.open{display:flex}.settings{background:#f5fafc;color:#153965;width:min(590px,95vw);border-radius:26px;padding:25px;box-shadow:0 20px 60px #0016}.settings h2{margin:0 0 12px}.settings label{display:block;font-weight:900;margin:18px 0 6px}.settings input{width:100%;padding:13px;border:2px solid #90bacc;border-radius:12px;font-size:24px}.buttons{display:flex;gap:9px;flex-wrap:wrap;margin-top:16px}.buttons button,.corner{border:0;border-radius:13px;padding:13px 17px;background:#126c97;color:white;font-weight:900}.buttons .secondary{background:#dcecf3;color:#245373}.corner{position:fixed;right:12px;bottom:12px;z-index:5;opacity:.7;font-size:13px;padding:7px 11px}.status{position:fixed;left:10px;bottom:8px;z-index:5;background:#032c46aa;padding:5px 8px;border-radius:9px;font-size:12px}.pulse{position:absolute;inset:0;z-index:4;pointer-events:none;animation:pulse 1.2s both;border:13px solid #ffed9c}@keyframes pulse{from{opacity:1}to{opacity:0}}@media(max-width:700px){.top{padding:15px}.title{padding:7px 13px;border-width:3px}.counter{min-width:115px;padding:9px;border-width:3px}.sub{margin:13px 4px}.center-text{bottom:24%}.milestones{font-size:10px}.meter{border-width:4px;padding:4px;gap:2px}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* Cinematic recovery version: artwork-backed, six unmistakable stages */
.board{isolation:isolate;background:#026b99}
.backdrop{background-position:center 53%;transform:scale(1.015);animation:oceanDrift 16s ease-in-out infinite alternate;transition:opacity 1.2s,filter 1.2s}
.board[data-stage="0"] .backdrop{filter:saturate(.76) brightness(.66)}
.board[data-stage="1"] .backdrop{filter:saturate(.85) brightness(.81)}
.board[data-stage="2"] .backdrop{filter:saturate(.95) brightness(.94)}
.board[data-stage="3"] .backdrop{filter:saturate(1.13) brightness(1.12);opacity:.6}
.board[data-stage="4"] .backdrop,.board[data-stage="5"] .backdrop{filter:saturate(1.23) brightness(1.15);opacity:.20}
@keyframes oceanDrift{to{transform:scale(1.065) translateX(-.8%)}}
.cleanSea{position:absolute;inset:0;background:radial-gradient(ellipse at 47% 5%,#c3faff88,transparent 38%),linear-gradient(180deg,#3eb5df 0%,#007eaf 63%,#055477 100%);opacity:0;transition:opacity 1.4s;pointer-events:none}
.board[data-stage="3"] .cleanSea{opacity:.32}.board[data-stage="4"] .cleanSea{opacity:.77}.board[data-stage="5"] .cleanSea{opacity:1}
.seaFloor{position:absolute;inset:auto 0 0;height:28%;z-index:1;opacity:0;transition:opacity 1s;background:radial-gradient(ellipse at 6% 98%,#ffba9a 0 7%,transparent 7.5%),radial-gradient(ellipse at 87% 98%,#df8dc7 0 8%,transparent 8.5%),linear-gradient(0deg,#146f93dd,transparent)}
.board[data-stage="4"] .seaFloor,.board[data-stage="5"] .seaFloor{opacity:1}
.whaleHero{position:absolute;width:min(60vw,960px);height:min(48vw,550px);left:20%;top:23%;z-index:2;opacity:0;transform:translateY(100px) scale(.72);transition:opacity 1.2s,transform 1.6s;pointer-events:none;filter:drop-shadow(0 15px 32px #00384a77)}
.whaleHero img{width:100%;height:100%;object-fit:contain;mask-image:radial-gradient(ellipse 49% 45% at 50% 50%,black 62%,transparent 100%);-webkit-mask-image:radial-gradient(ellipse 49% 45% at 50% 50%,black 62%,transparent 100%)}
.board[data-stage="3"] .whaleHero{opacity:.9;transform:translateY(40px) scale(.85)}
.board[data-stage="4"] .whaleHero{opacity:1;transform:translateY(10px) scale(1.04)}
.board[data-stage="5"] .whaleHero{opacity:1;transform:translateY(-3px) scale(1.12)}
.board[data-stage="3"] .whaleHero img{animation:whaleBreathe 3.1s ease-in-out infinite}
.board[data-stage="4"] .whaleHero img{animation:whaleBreathe 2.7s ease-in-out infinite}
.board[data-stage="5"] .whaleHero img{animation:whaleSwim 5s ease-in-out infinite}
@keyframes whaleBreathe{0%,100%{transform:translateY(8px) rotate(-2deg)}50%{transform:translateY(-15px) rotate(2deg)}}
@keyframes whaleSwim{0%,100%{transform:translate(-22px,17px) rotate(-5deg)}50%{transform:translate(35px,-30px) rotate(5deg)}}
.bubbleWorld{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:2}
.bubble{position:absolute;bottom:-10%;border:2px solid #d2f9ff99;box-shadow:inset -5px -6px 11px #70c9ee44,0 0 9px #f0ffff55;border-radius:50%;animation:rise var(--duration) linear infinite;animation-delay:var(--delay);width:var(--size);height:var(--size);left:var(--left);opacity:.6}
@keyframes rise{0%{transform:translate(0,0) scale(.8);opacity:0}12%{opacity:.75}85%{opacity:.7}100%{transform:translate(32px,-115vh) scale(1.4);opacity:0}}
.fish{position:absolute;left:-140px;top:var(--top);font-size:clamp(22px,3.6vw,59px);animation:fishSwim var(--swim) linear infinite;animation-delay:var(--delay);opacity:0;filter:drop-shadow(0 4px 3px #00384b55)}
.board[data-stage="3"] .fish,.board[data-stage="4"] .fish,.board[data-stage="5"] .fish{opacity:1}
@keyframes fishSwim{to{transform:translateX(calc(100vw + 260px))}}
.sparkles{position:absolute;inset:0;pointer-events:none;z-index:4;overflow:hidden}
.spark{position:absolute;color:#ffe57b;font-size:clamp(17px,3.7vw,48px);text-shadow:0 0 18px #fff0a3;animation:sparkMove 1.45s ease-out forwards;left:var(--x);top:var(--y)}
@keyframes sparkMove{0%{transform:scale(.15) rotate(0);opacity:0}20%{opacity:1}100%{transform:translateY(-100px) scale(1.5) rotate(80deg);opacity:0}}
.successFly{position:absolute;z-index:6;top:39%;left:50%;transform:translate(-50%,-50%) scale(.3);pointer-events:none;font-weight:1000;font-size:clamp(23px,4.6vw,73px);color:#fff7a6;text-shadow:0 5px 0 #06537c,0 0 30px #fff5a8;text-align:center;opacity:0}
.successFly.go{animation:scoreSplash 1.4s ease-out forwards}
@keyframes scoreSplash{0%{opacity:0;transform:translate(-50%,-30%) scale(.3)}25%{opacity:1;transform:translate(-50%,-50%) scale(1.18)}70%{opacity:1;transform:translate(-50%,-55%) scale(1)}100%{opacity:0;transform:translate(-50%,-80%) scale(.92)}}
.splash{position:absolute;top:19%;left:47%;z-index:5;pointer-events:none;opacity:0;font-size:clamp(54px,9vw,130px);filter:drop-shadow(0 5px 12px #1871a3)}
.board[data-stage="5"] .splash{animation:waterSplash 3.4s ease-in-out infinite}
@keyframes waterSplash{0%,15%,65%,100%{opacity:0;transform:translateY(26px) scale(.6)}34%{opacity:1;transform:translateY(-20px) scale(1.15)}}
.board[data-stage="5"] .center-text{color:#fff6a3;font-size:clamp(24px,3vw,55px)}
.board[data-stage="5"] .title{animation:celebrate 1.4s ease-in-out infinite alternate}
@keyframes celebrate{to{transform:rotate(1deg) scale(1.03)}}
.milestone{transition:opacity .3s,color .3s}.center-text{bottom:19%;padding:0 1rem;transition:color .3s}
.stageNotice{position:absolute;z-index:5;left:50%;top:19%;transform:translateX(-50%);border:3px solid #eafcff9c;border-radius:100px;background:#064965b8;padding:8px 25px;font-weight:900;font-size:clamp(15px,1.9vw,30px);white-space:nowrap;backdrop-filter:blur(4px)}
.board[data-stage="0"] .stageNotice{background:#2f5575b8}
.top{z-index:7}.footer{z-index:7}.corner,.status{z-index:8}
.board:not([data-stage="5"]) .happy{display:none!important}.board[data-stage="5"] .happy{display:none!important}
@media(max-width:700px){.whaleHero{width:86vw;left:7%;top:29%;height:43vh}.stageNotice{top:22%}.center-text{bottom:25%}.footer{bottom:5%}}
</style></head><body><main class="board" id="board" data-stage="0"><div class="backdrop"></div><div class="cleanSea"></div><div class="seaFloor"></div><div class="caustics"></div><div class="bubbleWorld" id="bubbleWorld"></div><div class="whaleHero"><img src="assets/whale_happy.png" alt="기운을 되찾아 헤엄치는 고래"></div><div class="splash" aria-hidden="true">💦</div><div class="sparkles" id="sparkles"></div><div class="successFly" id="successFly">잘했어! +1</div><div class="stageNotice" id="stageNotice">고래를 도와줘!</div><header class="top"><div><div class="title">고래를 구해요!</div><div class="sub">쓰레기를 바르게 분리하면 고래가 건강해져요!</div></div><div class="counter"><small>구조한 쓰레기</small><strong id="count">0 / 25</strong></div></header><div class="happy" id="happy"><img src="assets/whale_happy.png" alt="기뻐하는 고래"><h2>고마워!<br>다 함께<br>구해 줬어!</h2></div><div class="center-text" id="message">도와줘! 바다가 너무 아파요!</div><div class="footer"><div class="meter" id="meter" aria-label="구조 진행 상태"></div><div class="milestones"><span class="milestone" id="m0">시작</span><span class="milestone" id="m1">쓰레기 감소</span><span class="milestone" id="m2">그물 제거</span><span class="milestone" id="m3">기운 회복</span><span class="milestone" id="m4">고래 구조 성공!</span></div></div><button class="corner" id="settingsBtn">⚙ 교사 설정</button><div class="status" id="status">연결 준비 중</div></main>
<div class="overlay" id="overlay"><div class="settings"><h2>선생님 설정</h2><p>반 전체의 공동 목표를 설정합니다. 목표 변경 시 진행 기록은 0으로 초기화됩니다.</p><label for="goal">구조 목표 (1~200회)</label><input id="goal" type="number" min="1" max="200" value="25"><div class="buttons"><button id="apply">목표 적용</button><button class="secondary" id="add">시연 +1</button><button class="secondary" id="undo">1회 되돌리기</button><button class="secondary" id="reset">처음부터</button><button class="secondary" id="full">전체 화면</button><button class="secondary" id="close">닫기</button></div><p style="font-size:13px">시연 +1은 실제 구조 성공에 포함됩니다. Firebase 설정 전에는 같은 브라우저의 탭끼리만 연결되는 데모입니다.</p></div></div>
<script src="whale-config.js"></script><script type="module">
import {subscribe,initSync,isDemo,award,setGoal,reset,undo} from './whale-sync.js';
const $=id=>document.getElementById(id);let last=-1,lastStage=-1,seenRevision=-1,seenReady=false;
const stages=[
 {text:'도와줘! 바다가 너무 아파요!',tag:'① 고래가 아파요'},
 {text:'쓰레기가 줄어들고 있어요!',tag:'② 조금 나아졌어요'},
 {text:'그물이 풀렸어! 힘을 내볼게!',tag:'③ 눈을 떴어요'},
 {text:'고마워! 다시 웃을 수 있어!',tag:'④ 웃기 시작했어요'},
 {text:'우와! 이제 헤엄칠 수 있어!',tag:'⑤ 활기를 되찾았어요'},
 {text:'우리가 함께 고래를 구했어요!',tag:'⑥ 고래 구조 성공!'}
];
let audioCtx=null;
function sound(stage){try{audioCtx ||=new (window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();let now=audioCtx.currentTime;for(let i=0;i<(stage===5?5:2);i++){let o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='sine';o.frequency.setValueAtTime((stage===5?440:520)+i*110,now+i*.14);g.gain.setValueAtTime(.0001,now+i*.14);g.gain.exponentialRampToValueAtTime(.085,now+i*.14+.018);g.gain.exponentialRampToValueAtTime(.0001,now+i*.14+.24);o.connect(g).connect(audioCtx.destination);o.start(now+i*.14);o.stop(now+i*.14+.26)}}catch{}}
function celebrate(stage){const board=$('board');const label=$('successFly');label.textContent=stage===5?'🐳 고래 구조 성공!':'참 잘했어! +1';label.classList.remove('go');void label.offsetWidth;label.classList.add('go');const p=document.createElement('div');p.className='pulse';board.append(p);setTimeout(()=>p.remove(),1300);const layer=$('sparkles');for(let i=0;i<(stage===5?45:12);i++){const el=document.createElement('span');el.className='spark';el.textContent=i%3===0?'✦':'★';el.style.setProperty('--x',(15+Math.random()*70)+'%');el.style.setProperty('--y',(25+Math.random()*50)+'%');layer.append(el);setTimeout(()=>el.remove(),1500)}sound(stage)}
for(let i=0;i<19;i++){let b=document.createElement('i');b.className='bubble';b.style.setProperty('--left',(Math.random()*100)+'%');b.style.setProperty('--size',(8+Math.random()*32)+'px');b.style.setProperty('--duration',(6+Math.random()*9)+'s');b.style.setProperty('--delay',(-Math.random()*15)+'s');$('bubbleWorld').append(b)}
for(let i=0;i<4;i++){let f=document.createElement('div');f.className='fish';f.textContent=i%2===0?'🐠':'🐟';f.style.setProperty('--top',(34+i*13)+'%');f.style.setProperty('--swim',(10+i*2)+'s');f.style.setProperty('--delay',(-i*3)+'s');$('bubbleWorld').append(f)}
subscribe(s=>{
 const pct=Math.min(1,s.count/s.goal),stage=s.count>=s.goal?5:Math.min(4,Math.floor(pct*5));
 $('count').textContent=`${s.count} / ${s.goal}`;
 $('board').dataset.stage=String(stage);
 $('message').textContent=stages[stage].text;
 $('stageNotice').textContent=stages[stage].tag;
 $('meter').style.setProperty('--slots',Math.min(s.goal,50));
 let html='';for(let i=0;i<Math.min(s.goal,50);i++)html+=`<span class="slot ${i/Math.min(s.goal,50)<pct?'filled':''}"></span>`;
 $('meter').innerHTML=html;
 for(let j=0;j<5;j++)$('m'+j).classList.toggle('on',pct>=j/4);
 if(seenReady&&s.count>last&&s.revision!==seenRevision)celebrate(stage);
 seenReady=true;seenRevision=s.revision;last=s.count;lastStage=stage;
 $('status').textContent=isDemo()?'체험 모드 · 동일 브라우저만 연결':'Firebase 실시간 연결';
});
initSync();window.addEventListener('whale-sync-error',e=>$('status').textContent='연결 오류: '+e.detail);
$('settingsBtn').onclick=()=>$('overlay').classList.add('open');$('close').onclick=()=>$('overlay').classList.remove('open');
async function act(fn){try{await fn()}catch(e){alert('저장 실패: '+e.message)}}
$('apply').onclick=()=>{if(confirm('목표를 바꾸고 진행 기록을 초기화할까요?'))act(()=>setGoal($('goal').value))};$('add').onclick=()=>act(award);$('undo').onclick=()=>act(undo);$('reset').onclick=()=>{if(confirm('전체 구조 기록을 초기화할까요?'))act(reset)};$('full').onclick=()=>document.documentElement.requestFullscreen?.();
subscribe(s=>$('goal').value=s.goal);
</script></body></html>
