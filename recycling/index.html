<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>출동! 새싹 지구구조대</title><style>
:root{font-family:'Trebuchet MS','Malgun Gothic',sans-serif;color:#315267;background:#ecfbf5}*{box-sizing:border-box}body{margin:0;background:linear-gradient(150deg,#dff6ff 0%,#f9fbe5 55%,#c8f0c9 100%);min-height:100dvh}.shell{max-width:880px;margin:auto;padding:16px 14px 35px}header{text-align:center;border:5px solid white;background:#fff4d5;border-radius:35px;padding:17px 8px;box-shadow:0 8px 0 #ded6a8}h1{font-size:clamp(26px,6vw,48px);line-height:1.25;color:#237bb7;text-shadow:2px 3px #fff;margin:0}header p{font-size:clamp(13px,3.2vw,19px);font-weight:900;margin:6px}.panel{background:#ffffffeb;border:4px solid #fff;border-radius:30px;box-shadow:0 8px 16px #72a59345;margin:18px 0;padding:16px}.hero{display:flex;align-items:center;justify-content:space-around;gap:12px}.earth{position:relative;background:radial-gradient(circle at 25% 20%,#baf4ff,#56c2ed 70%,#2992dc);width:clamp(120px,36vw,230px);height:clamp(120px,36vw,230px);border-radius:50%;border:7px solid white;box-shadow:0 9px 0 #8ec8d9;overflow:hidden;flex-shrink:0}.earth:before,.earth:after{content:'';position:absolute;background:#7bcf77;border-radius:45% 55% 55% 45%;transform:rotate(25deg)}.earth:before{width:70%;height:45%;top:8%;left:-12%}.earth:after{width:58%;height:70%;top:47%;right:-9%}.face{position:absolute;z-index:2;inset:30% 12% 15%;text-align:center;font-size:clamp(32px,8vw,65px);font-weight:900;color:#254659}.eyes{letter-spacing:13px;font-family:Arial}.mouth{color:#e66f83;margin-top:-10px}.leaf{position:absolute;top:-8px;left:49%;font-size:24px}.status strong{font-size:clamp(25px,6vw,43px)}.status p{font-size:17px;font-weight:800}.progress{display:flex;gap:5px;margin:14px 0}.pip{flex:1;height:17px;border-radius:12px;background:#e7e7e7}.pip.got{background:#7bd4a0}.primary,.secondary,.answer{border:0;border-radius:22px;padding:15px 18px;font-size:20px;font-weight:900;cursor:pointer;box-shadow:0 5px 0 #a1c3be;background:#67baf2;color:white;touch-action:manipulation}.secondary{background:#ebf3db;color:#3e7565}.primary:active,.secondary:active,.answer:active{transform:translateY(3px);box-shadow:0 2px 0 #a1c3be}.buttons{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}.muted{font-size:13px;color:#6b8290;text-align:center}.cardgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}.cardpick{border:4px solid #e0f2ef;border-radius:22px;background:#f7fffc;padding:6px;cursor:pointer;position:relative}.cardpick img{width:100%;aspect-ratio:4/5;object-fit:contain}.cardpick small{display:block;text-align:center;font-weight:900}.cardpick.done{border-color:#52bd82}.cardpick.done:after{content:'✓';position:absolute;right:8px;top:4px;font-size:36px;color:#1aab61}.hidden{display:none!important}.question-title{text-align:center;font-weight:900;font-size:clamp(23px,5vw,35px);margin:6px 0 15px}.featured{display:block;margin:auto;width:min(210px,48vw);max-height:240px;object-fit:contain;border-radius:20px;box-shadow:0 5px 0 #ddd}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:17px 0}.answer{display:flex;flex-direction:column;align-items:center;gap:7px;color:#33505b;border:4px solid white;border-radius:24px;min-height:145px;padding:8px 6px;font-size:clamp(16px,3.5vw,23px)}.answer svg{width:min(125px,100%);height:87px}.answer:nth-child(1){background:#bbdffe}.answer:nth-child(2){background:#f6e4a2}.answer:nth-child(3){background:#ffb8b2}.answer:nth-child(4){background:#d5c3f5}.answer:nth-child(5){background:#bfeace}.answer.wrong{animation:shake .28s}@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}.message{min-height:60px;font-size:21px;font-weight:900;text-align:center;color:#26816b}.teacher{margin-top:28px}.teacher summary{cursor:pointer;color:#82919b;font-size:14px}.teacher button{font-size:14px;padding:10px;margin:5px}.cameraLayer{position:fixed;inset:0;background:#101820;z-index:20}.cameraLayer a-scene{position:absolute!important;inset:0}.cameraHud{z-index:40;position:absolute;inset:auto 12px 24px;text-align:center;background:#ffffffed;border-radius:28px;padding:15px;color:#36576b;font-weight:900}.cameraHud button{margin:5px}#result{position:fixed;z-index:50;inset:0;background:#0008;display:grid;place-items:center;padding:12px}.resultCard{max-width:520px;width:100%;background:#fff8e9;padding:20px;border-radius:30px;text-align:center;border:6px solid #fff}.resultCard h2{font-size:34px}.resultCard img{width:min(200px,50vw)}.help{padding:10px 16px;line-height:1.6}#confetti{position:fixed;pointer-events:none;inset:0;z-index:80}.spark{position:absolute;top:-40px;animation:fall 2.2s linear forwards;width:12px;height:18px;border-radius:4px}@keyframes fall{to{transform:translateY(110vh) rotate(690deg)}}@media(max-width:500px){.hero{align-items:flex-start}.panel{padding:12px}.choices{gap:7px}.answer{min-height:125px}.cardgrid{gap:5px}}
</style></head><body><div id="confetti"></div><main class="shell"><header><h1>출동! 새싹 지구구조대</h1><p>숨은 재활용 보물을 찾아라!</p></header><section id="home"><div class="panel hero"><div class="earth"><div class="face"><div class="eyes">⌒⌒</div><div class="mouth">◡</div></div></div><div class="status"><p>우리가 찾은 보물</p><strong id="score">0 / 6</strong><div class="progress" id="progress"></div><p id="cheer">보물 그림을 찾아봐요!</p></div></div><div class="panel"><div class="buttons"><button class="primary" id="startCam">카메라로 보물 찾기</button><button class="secondary" id="demo">그림으로 찾아보기</button></div><p class="muted">QR코드가 아닌 그림 인식 · 카메라는 HTTPS 사이트에서 이용</p></div><div class="panel"><h2>우리의 보물 지도</h2><div class="cardgrid" id="cardgrid"></div></div></section><section id="quiz" class="panel hidden"><button class="secondary" id="back">← 돌아가기</button><h2 class="question-title">어느 곳에 분리수거할까요?</h2><img class="featured" id="currentImg" alt="찾은 그림"><div class="choices" id="choices"></div><div class="message" id="feedback" aria-live="polite"></div></section><section id="finish" class="panel hidden" style="text-align:center"><h2 style="font-size:37px">지구 구출 성공!</h2><div class="earth" style="margin:auto"></div><h2>우리 모두 해냈어요!</h2><button class="primary" id="restart">다시 놀기</button></section><details class="teacher panel"><summary>선생님 설정 열기</summary><p>교실 카드에 카메라를 비추어도 잘 인식되지 않을 때는 '그림으로 찾아보기'를 이용하세요. 보물 선택 메뉴는 교사와 함께 사용합니다.</p><button class="secondary" id="reset">진행 상황 초기화</button><p class="muted" id="targetState"></p></details></main><div class="cameraLayer hidden" id="cameraLayer"><div id="arRoot"></div><div class="cameraHud"><p id="cameraStatus">그림 카드가 화면에 크게 보이도록 비춰 주세요</p><button class="secondary" id="closeCam">카메라 닫기</button><button class="secondary" id="manual">그림 선택으로 전환</button></div></div><div id="result" class="hidden"><div class="resultCard"><h2 id="resultTitle">성공!</h2><img id="resultImage" alt="보물"><p id="resultDetail"></p><button class="primary" id="next">다음 보물 찾기</button></div></div><script>
const data=[{name:'신문지',type:'종이',desc:'깨끗한 신문지는 종이류에 넣어요.'},{name:'종이상자',type:'종이',desc:'깨끗한 상자는 테이프를 떼고 접어서 종이류에 넣어요.'},{name:'종이팩',type:'종이팩',desc:'우유팩 같은 종이팩은 비우고 헹궈서 따로 모아요.'},{name:'페트병',type:'페트병',desc:'투명 페트병은 비우고, 라벨을 떼고, 찌그러뜨려 따로 배출해요.'},{name:'음료캔',type:'캔',desc:'빈 음료캔은 내용물을 비우고 캔류에 넣어요.'},{name:'비닐봉지',type:'비닐',desc:'깨끗한 비닐봉지는 비닐류에 넣어요.'}];
const cats=['종이','종이팩','페트병','캔','비닐'];let done=JSON.parse(localStorage.getItem('saessak-done')||'[]'),current=-1,arScene=null,arStarted=false,scanLock=false;
const el=id=>document.getElementById(id);const img=i=>`cards/${String(i+1).padStart(2,'0')}.png`;
function pict(type){let s='#354b65';let wrap=(x)=>`<svg viewBox="0 0 140 98" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">${x}</svg>`;if(type==='종이')return wrap(`<rect x="28" y="23" width="75" height="53" rx="8" fill="#fff" stroke="${s}" stroke-width="5"/><path d="M39 38h52 M39 51h52 M39 64h36" stroke="#7ab9eb" stroke-width="5" stroke-linecap="round"/><path d="M86 77L119 64 105 49 76 62z" fill="#d8a773" stroke="${s}" stroke-width="4"/>`);if(type==='종이팩')return wrap(`<path d="M41 30L58 13h34l16 17v53H41z" fill="#f7fffa" stroke="${s}" stroke-width="5"/><path d="M41 30h67M58 13v17" stroke="${s}" stroke-width="4"/><rect x="53" y="40" width="44" height="30" rx="9" fill="#9edff4"/><circle cx="69" cy="53" r="3" fill="${s}"/><circle cx="83" cy="53" r="3" fill="${s}"/>`);if(type==='페트병')return wrap(`<rect x="53" y="7" width="33" height="17" rx="5" fill="#51a7d8" stroke="${s}" stroke-width="4"/><rect x="45" y="23" width="50" height="63" rx="16" fill="#abedff" stroke="${s}" stroke-width="5"/><path d="M48 44h44 M48 61h44" stroke="#e9ffff" stroke-width="8"/>`);if(type==='캔')return wrap(`<rect x="47" y="15" width="48" height="68" rx="12" fill="#f77d81" stroke="${s}" stroke-width="5"/><ellipse cx="71" cy="15" rx="24" ry="8" fill="#cde2e8" stroke="${s}" stroke-width="4"/><ellipse cx="71" cy="83" rx="24" ry="7" fill="#d05e71" stroke="${s}" stroke-width="3"/><path d="M61 35h20v28H61z" fill="#ffced8"/>`);return wrap(`<path d="M33 33L50 15l12 16h18l12-16 17 18-8 50H41z" fill="#e1d5ff" stroke="${s}" stroke-width="5" stroke-linejoin="round"/><path d="M62 33c0 13 18 13 18 0" fill="none" stroke="white" stroke-width="5"/>`)}
function show(id){for(const k of ['home','quiz','finish'])el(k).classList.toggle('hidden',k!==id)}
function render(){el('score').textContent=`${done.length} / 6`;el('progress').innerHTML=data.map((_,i)=>`<span class="pip ${done.includes(i)?'got':''}"></span>`).join('');el('cardgrid').innerHTML=data.map((d,i)=>`<button class="cardpick ${done.includes(i)?'done':''}" data-id="${i}"><img src="${img(i)}" alt="${d.name}"><small>${d.name}</small></button>`).join('');document.querySelectorAll('.cardpick').forEach(b=>b.onclick=()=>begin(+b.dataset.id));el('cheer').textContent=done.length?'정말 잘하고 있어요!':'보물 그림을 찾아봐요!'}
function begin(i){if(done.includes(i))return;current=i;scanLock=true;stopAR();el('currentImg').src=img(i);el('feedback').textContent='그림을 보고 골라봐요!';el('choices').innerHTML=cats.map(t=>`<button class="answer" data-cat="${t}">${pict(t)}<span>${t}</span></button>`).join('');document.querySelectorAll('.answer').forEach(b=>b.onclick=()=>choose(b));show('quiz')}
function choose(b){let yes=b.dataset.cat===data[current].type;if(!yes){b.classList.remove('wrong');void b.offsetWidth;b.classList.add('wrong');el('feedback').textContent='다시 생각해 볼까요?';return}if(!done.includes(current)){done.push(current);localStorage.setItem('saessak-done',JSON.stringify(done))}render();confetti();el('resultTitle').textContent='참 잘했어요!';el('resultImage').src=img(current);el('resultDetail').textContent=data[current].desc;el('result').classList.remove('hidden');}
function confetti(){for(let i=0;i<42;i++){let a=document.createElement('span');a.className='spark';a.style.left=Math.random()*100+'%';a.style.background=['#5ed4ac','#78c9f6','#f3cf67','#fb8f9f'][i%4];a.style.animationDelay=Math.random()*.7+'s';el('confetti').append(a);setTimeout(()=>a.remove(),3100)}}
el('next').onclick=()=>{el('result').classList.add('hidden');if(done.length===6){show('finish');confetti()}else{show('home');render()}};el('back').onclick=()=>{show('home');render()};el('reset').onclick=el('restart').onclick=()=>{done=[];localStorage.removeItem('saessak-done');show('home');render()};el('demo').onclick=()=>{show('home');el('cardgrid').scrollIntoView({behavior:'smooth'})};el('manual').onclick=()=>{stopAR();show('home');el('cardgrid').scrollIntoView()};el('closeCam').onclick=stopAR;
// Browser camera tracks the printed illustration itself, never QR. Requires targets.mind produced from cards 01..06 in the same order.
function startAR(){if(!window.AFRAME || !window.MINDAR){el('cameraStatus').textContent='카메라 라이브러리를 불러오지 못했어요. 인터넷 연결을 확인하세요.';return}if(arStarted)return;arStarted=true;scanLock=false;el('cameraLayer').classList.remove('hidden');let root=el('arRoot');root.innerHTML=`<a-scene id="arScene" mindar-image="imageTargetSrc: ./targets.mind; autoStart: false; maxTrack: 1; uiScanning: no; uiLoading: no; uiError: no" embedded color-space="sRGB" renderer="colorManagement: true" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false"><a-camera position="0 0 0" look-controls="enabled: false"></a-camera>${data.map((_,i)=>`<a-entity id="target${i}" mindar-image-target="targetIndex: ${i}"></a-entity>`).join('')}</a-scene>`;let scene=el('arScene');scene.addEventListener('loaded',async()=>{try{for(let i=0;i<6;i++)el('target'+i).addEventListener('targetFound',()=>{if(!scanLock)begin(i)});await scene.systems['mindar-image-system'].start();el('cameraStatus').textContent='숨겨진 그림을 찾아 카메라에 보여주세요!'}catch(e){el('cameraStatus').textContent='카메라를 시작하지 못했어요. targets.mind와 HTTPS 연결을 확인하세요.';console.error(e)}})}
function stopAR(){const sc=el('arScene');try{if(sc&&sc.systems&&sc.systems['mindar-image-system'])sc.systems['mindar-image-system'].stop()}catch(e){}if(sc){try{sc.parentElement.removeChild(sc)}catch(e){}}arStarted=false;el('cameraLayer').classList.add('hidden')}
el('startCam').onclick=async()=>{try{const res=await fetch('./targets.mind',{method:'HEAD'});if(!res.ok)throw Error();startAR()}catch(e){alert('그림 인식 준비 단계가 남아 있어요. 설명서대로 카드 6장을 컴파일해 targets.mind 파일을 넣어주세요. 지금은 그림 선택 모드로 체험할 수 있습니다.')}};
fetch('./targets.mind',{method:'HEAD'}).then(r=>el('targetState').textContent=r.ok?'그림 인식 데이터 감지됨':'그림 인식 데이터 없음: 설명서에 따라 targets.mind 생성 필요').catch(()=>el('targetState').textContent='로컬 파일에서 카메라 연결 확인 불가. HTTPS로 배포하세요.');render();
</script><script src="https://aframe.io/releases/1.4.2/aframe.min.js" defer></script><script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js" defer></script></body></html>
